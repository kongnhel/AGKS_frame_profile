<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGKS Profile Frame</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img class="logo-icon" src="logo.png" alt="AGKS Logo">
                <div>
                    <h1>Profile Frame</h1>
                    <p class="tagline">Create your profile picture in seconds</p>
                </div>
            </div>
        </header>

        <!-- Step 1: Upload -->
        <section class="card step active" id="step1">
            <div class="card-header">
                <span class="step-badge">1</span>
                <h2>Upload Photo</h2>
            </div>
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="upload-text">Click to browse or drag & drop</p>
                <p class="upload-hint">JPG, PNG, WEBP — any size</p>
            </div>
        </section>

        <!-- Step 2: Edit & Preview -->
        <section class="card step" id="step2">
            <div class="card-header">
                <span class="step-badge">2</span>
                <h2>Adjust Your Photo</h2>
            </div>

            <div class="editor-layout">
                <!-- Live Preview -->
                <div class="preview-panel">
                    <div class="preview-frame" id="previewFrame">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                    <p class="drag-hint" id="dragHint">Drag photo to reposition</p>
                </div>

                <!-- Controls -->
                <div class="controls-panel">
                    <div class="control-group">
                        <label class="control-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                            Zoom
                        </label>
                        <div class="slider-row">
                            <input type="range" id="zoomSlider" min="50" max="300" value="100" class="slider">
                            <span class="slider-value" id="zoomValue">100%</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                            Position
                        </label>
                        <p class="control-hint">Click and drag on the preview to move</p>
                    </div>

                    <div class="btn-row">
                        <button class="btn btn-outline" id="resetBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                            Reset
                        </button>
                        <button class="btn btn-outline" id="changePhotoBtn">Change Photo</button>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-ghost" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Back
                </button>
                <button class="btn btn-primary btn-lg" id="downloadBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                </button>
            </div>
        </section>

        <!-- Full result canvas (hidden, for export) -->
        <canvas id="exportCanvas" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
