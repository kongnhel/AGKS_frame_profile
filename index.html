<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AGKS Profile Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header>
      <img class="logo" src="logo.png" alt="AGKS">
      <h1>ដាក់រូបថតក្នុងស៊ុម</h1>
    </header>

    <div class="card">
      <canvas id="canvas" width="800" height="800"></canvas>

      <div class="overlay" id="overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>ដាក់រូបថតរបស់អ្នក</p>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <label class="upload-btn" for="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="3"/></svg>
        ជ្រើសរើសរូបថត
      </label>
      <input type="file" id="upload" accept="image/*">
    </div>

    <div class="controls" id="controls" style="display:none">
      <div class="slider-wrap">
        <input type="range" id="zoom" min="0.2" max="3" step="0.01" value="1">
        <span id="zoomVal">100%</span>
      </div>
      <div class="btn-row">
        <button id="downloadBtn" class="btn green">Download</button>
        <button id="resetBtn" class="btn ghost">Reset</button>
      </div>
    </div>

    <p class="hint" id="hint">រូបភាពនៅពីក្រោយស៊ុម · ទាញដើម្បីផ្លាស់ទី</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
